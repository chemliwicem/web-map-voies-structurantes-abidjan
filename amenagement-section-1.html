<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>Aménagement de la Section 1 - Contournement de Bingerville</title>
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <link rel="stylesheet" href="./pfe-custom.css">
        <link rel="stylesheet" href="./section-amenagement.css">
    </head>
    <body class="amenagement-page">
        <div id="section-map-shell">
            <a class="back-to-main" href="index.html" aria-label="Retour à la carte principale">‹</a>
            <h1 class="section-map-title">Aménagement de la Section 1</h1>
            <div id="section-map"></div>

            <aside id="amenagement-legend" class="route-legend amenagement-legend collapsed" aria-label="Légende de l'aménagement">
                <div class="legend-header">
                    <div>
                        <h2>Légende</h2>
                        <p>Afficher ou masquer les éléments de la section.</p>
                    </div>
                    <button id="amenagement-legend-toggle" type="button" aria-label="Ouvrir la légende">+</button>
                </div>
                <div id="amenagement-controls" class="amenagement-controls">
                    <label class="route-item">
                        <input id="toggle-amenagement" type="checkbox" checked>
                        <span class="route-swatch amenagement-swatch"></span>
                        <span class="route-label">Aménagement Section 1</span>
                    </label>
                    <label class="route-item">
                        <input id="toggle-orthos" type="checkbox">
                        <span class="route-swatch ortho-swatch"></span>
                        <span class="route-label">Orthophotos</span>
                    </label>
                    <p class="basemap-title">Changer fond de carte</p>
                    <div class="basemap-switch" role="group" aria-label="Fond de carte">
                        <button id="basemap-osm" class="active" type="button">OSM</button>
                        <button id="basemap-esri" type="button">Esri World Imagery</button>
                    </div>
                </div>
            </aside>
        </div>

        <script src="./resources/proj4.js"></script>
        <script>proj4.defs('EPSG:32630','+proj=utm +zone=30 +datum=WGS84 +units=m +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./layers/Coucherefactorise_1.js"></script>
        <script src="./styles/Coucherefactorise_1_style.js"></script>
        <script src="./section-amenagement.js"></script>
    </body>
</html>
