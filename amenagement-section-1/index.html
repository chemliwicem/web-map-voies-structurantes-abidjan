<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <link rel="stylesheet" href="./pfe-amenagement.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="section-map-shell">
        <button id="back-button" class="back-to-previous" type="button" aria-label="Retour à la page précédente">‹</button>
        <h1 class="section-map-title">Aménagement de la Section 1</h1>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <aside id="amenagement-legend" class="amenagement-legend collapsed" aria-label="Légende de l'aménagement">
            <div class="legend-header">
                <div>
                    <h2>Légende</h2>
                    <p>Afficher ou masquer les éléments de la section.</p>
                </div>
                <button id="amenagement-legend-toggle" type="button" aria-label="Ouvrir la légende">+</button>
            </div>
            <div id="amenagement-controls" class="amenagement-controls">
                <label class="route-item">
                    <input id="toggle-amenagement" type="checkbox" checked>
                    <span class="route-swatch amenagement-swatch"></span>
                    <span class="route-label">Aménagement Section 1</span>
                </label>
                <label class="route-item">
                    <input id="toggle-orthos" type="checkbox">
                    <span class="route-swatch ortho-swatch"></span>
                    <span class="route-label">Orthophotos</span>
                </label>
                <p class="basemap-title">Changer fond de carte</p>
                <div class="basemap-switch" role="group" aria-label="Fond de carte">
                    <button id="basemap-osm" class="active" type="button">OSM</button>
                    <button id="basemap-esri" type="button">Esri World Imagery</button>
                </div>
            </div>
        </aside>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
<script src="resources/proj4.js"></script>
        <script>proj4.defs('EPSG:32630','+proj=utm +zone=30 +datum=WGS84 +units=m +no_defs');</script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/EMPRISE_3.js"></script>
        <script src="styles/EMPRISE_3_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script src="./pfe-amenagement.js"></script>        
    </body>
</html>
